<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MalikGPT - Socials</title>
<meta name="description" content="Find MalikGPT on YouTube, Twitch, TikTok, Kick, Instagram, X, Rumble and Snapchat.">
<meta property="og:image" content="avatar.jpg">
<link rel="icon" href="avatar.jpg">
<style>
:root{--cy:#22e5ff;--mg:#d946ef;--pu:#7c3aed;--or:#ff9d3c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#eaf6ff;font-family:system-ui,sans-serif;text-align:center;
background:linear-gradient(rgba(5,4,22,.82),rgba(5,4,22,.92)),url(bg.jpg) center/cover fixed #07071a}
main{max-width:900px;margin:0 auto;padding:2.5rem 1rem 4rem}
.av{width:clamp(150px,38vw,210px);aspect-ratio:1;margin:0 auto 1rem;padding:5px;border-radius:50%;
background:conic-gradient(var(--cy),var(--mg),var(--or),var(--cy));box-shadow:0 0 28px rgba(34,229,255,.55),0 0 60px rgba(217,70,239,.35);animation:spin 8s linear infinite}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;animation:spin 8s linear infinite reverse;border:3px solid #07071a}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:.2rem 0;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:.04em;color:#bff7ff;
text-shadow:0 0 8px var(--cy),0 0 22px var(--cy),0 0 40px var(--mg)}
.sub{margin:0 0 2rem;opacity:.8;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem;color:#ffd9a8}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
a.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 12px;border-radius:16px;color:inherit;text-decoration:none;
background:linear-gradient(160deg,rgba(124,58,237,.28),rgba(34,229,255,.12));border:1px solid rgba(34,229,255,.45);
box-shadow:0 0 12px rgba(34,229,255,.18),inset 0 0 14px rgba(217,70,239,.12);backdrop-filter:blur(4px);transition:transform .2s,box-shadow .2s,border-color .2s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--or);outline:none;
box-shadow:0 0 22px rgba(34,229,255,.7),0 0 38px rgba(217,70,239,.5)}
a.card svg{width:38px;height:38px;fill:#fff;filter:drop-shadow(0 0 6px var(--cy)) drop-shadow(0 0 10px var(--mg))}
a.card span{font-weight:700;letter-spacing:.03em}
@media(prefers-reduced-motion:reduce){.av,.av img{animation:none}a.card{transition:none}a.card:hover{transform:none}}
</style></head><body>
<main>
  <div class="av"><img src="avatar.jpg" alt="MalikGPT avatar" width="480" height="480"></div>
  <h1>MalikGPT</h1>

  };
const list = document.getElementById("list");
SOCIALS.forEach(s => {
  const li = document.createElement("li"), a = document.createElement("a");
  a.className = "card"; a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", `MalikGPT on ${s.name} (opens in a new tab)`);
  a.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[s.id]}</svg><span></span>`;
  a.querySelector("span").textContent = s.name;
  li.append(a); list.append(li);
});
</script>
</body></html>
